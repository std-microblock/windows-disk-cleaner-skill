name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Sync pinned toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Rust formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Build
        run: cargo build --release --locked --bin disk-cleaner
      - name: Node syntax
        run: |
          node --check scripts/package-skill.mjs
          node --check scripts/archive-skill.mjs
          node --check scripts/install-skill.mjs
          node --check scripts/fetch-fluent-icons.mjs
      - name: Text formatting
        run: npx --yes prettier@3.8.1 --check README.md THIRD_PARTY_NOTICES.md ".prettierrc.json" "skill/**/*.md" "skill/**/*.yaml" "scripts/**/*.mjs" ".github/workflows/*.yml"
