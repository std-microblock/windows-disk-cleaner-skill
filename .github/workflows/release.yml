name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and publish (for example v0.1.0)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  skill:
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - name: Sync pinned toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Build disk-cleaner.exe
        run: cargo build --release --locked --bin disk-cleaner
      - name: Assemble skill package
        run: node scripts/package-skill.mjs --version "$env:RELEASE_TAG"
      - name: Smoke-test the packaged CLI
        run: dist\windows-disk-cleaner\bin\disk-cleaner.exe doctor --json
      - name: Archive package and checksums
        run: node scripts/archive-skill.mjs
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Continue'
          gh release view $env:RELEASE_TAG --json tagName 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:RELEASE_TAG dist\windows-disk-cleaner-skill.zip dist\SHA256SUMS.txt --clobber
          } else {
            gh release create $env:RELEASE_TAG dist\windows-disk-cleaner-skill.zip dist\SHA256SUMS.txt --verify-tag --title "windows-disk-cleaner $env:RELEASE_TAG" --generate-notes
          }
          if ($LASTEXITCODE -ne 0) { exit 1 }
