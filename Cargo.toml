[package]
name = "disk-cleaner"
version = "0.3.0"
edition = "2024"
rust-version = "1.92"
license = "Apache-2.0"
description = "Agent-oriented, read-only-first Windows disk analysis and user-confirmed cleanup"
build = "build.rs"
repository = "https://github.com/std-microblock/windows-disk-cleaner-skill"

[features]
default = ["gui"]
gui = ["dep:slint", "dep:slint-build", "dep:image"]

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
rayon = "1.11"
ahash = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1.3"
chrono = { version = "0.4", default-features = false, features = ["std"] }
librefs = { version = "=0.1.0", default-features = false, features = ["std", "sha2", "zstd", "lz4"] }
git2 = { version = "0.21", features = ["cred", "ssh", "https"] }
fs2 = "0.4"
uuid = { version = "1", features = ["v4", "serde"] }
blake3 = "1"
slint = { version = "=1.18.1", optional = true, default-features = false, features = ["std", "backend-winit", "renderer-software", "compat-1-18", "accessibility"] }

image = { version = "0.25", default-features = false, features = ["png"], optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Environment", "Win32_System_IO", "Win32_System_Ioctl", "Win32_System_Threading", "Win32_System_Console", "Win32_System_Pipes", "Win32_System_ProcessStatus", "Win32_System_RestartManager", "Win32_System_Registry", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
slint-build = { version = "=1.18.1", optional = true }


[profile.dev]
debug = 0
incremental = false

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 8
strip = "debuginfo"
